services:
  redis:
    image: redis:7-alpine
    container_name: f1predict-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: f1predict-backend
    env_file:
      - backend/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ENV=development
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Frontend/Dockerfile
    container_name: f1predict-frontend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
